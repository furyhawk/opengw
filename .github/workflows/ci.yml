name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            install: |
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends \
                build-essential \
                cmake \
                ninja-build \
                pkg-config \
                libx11-dev \
                libxext-dev \
                libxrandr-dev \
                libxcursor-dev \
                libxfixes-dev \
                libxi-dev \
                libxss-dev \
                libxinerama-dev \
                libxkbcommon-dev \
                libxtst-dev \
                libgl1-mesa-dev \
                curl \
                xvfb
              SDL_VERSION="3.4.16"
              curl -fsSL "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-${SDL_VERSION}.tar.gz" -o /tmp/SDL3.tar.gz
              tar -xzf /tmp/SDL3.tar.gz -C /tmp
              cmake -S "/tmp/SDL3-${SDL_VERSION}" -B /tmp/SDL3-build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_INSTALL_PREFIX=/usr/local \
                -DSDL_SHARED=ON \
                -DSDL_STATIC=OFF \
                -DSDL_INSTALL=ON \
                -DSDL_TESTS=OFF
              cmake --build /tmp/SDL3-build
              sudo cmake --install /tmp/SDL3-build
              sudo ldconfig
          - os: macos-latest
            name: macos
            install: |
              brew update
              brew install sdl3

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.install }}

      - name: Build project
        shell: bash
        run: |
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          make clean
          make -j"$JOBS"

      - name: Smoke test startup
        shell: bash
        run: make smoke