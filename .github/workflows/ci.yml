name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            install: |
              sudo apt-get update -qq
              sudo apt-get install -y --no-install-recommends \
                libsdl3-dev \
                libgl1-mesa-dev
          - os: macos-latest
            name: macos
            install: |
              brew update
              brew install sdl3

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: ${{ matrix.install }}

      - name: Build project
        shell: bash
        run: |
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 2)"
          make clean
          make -j"$JOBS"