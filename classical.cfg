# Classical-mode gameplay parameters
#
# Trigonometry Wars loads this file at startup to tune the "Classical" match mode. Every
# value below matches the game's built-in default, so deleting or editing this
# file simply overrides the matching values. If a key is missing or the file is
# absent the game falls back to its hardcoded defaults.
#
# Format: one "key = value" per line; '#' starts a comment; blank lines are
# ignored. Timers are in frames (60 fps); speeds are world units per frame.

# --- Match / flow ---------------------------------------------------------
# Grid fade-in start level when a match begins (climbs to 1 via brightnessRamp).
match.brightnessStart = -2
# Grid brightness ramp applied per frame toward 1.
match.brightnessRamp = 0.05
# Match-music pitch when nobody is respawning.
match.musicNormalSpeed = 1.0
# Instant music pitch while a joined player is respawning.
match.musicRespawnSpeed = 0.5
# Slow music ramp back up toward the target speed (per frame).
match.musicSpeedUpStep = 0.005
# Faster music drop toward the target speed (per frame).
match.musicSpeedDownStep = 0.01
# Co-op (>1 player) shared life pool at the start of a match.
match.coopLives = 10
# Co-op shared bomb pool at the start of a match.
match.coopBombs = 0

# --- Player ship & single-player economy ----------------------------------
# Starting lives and bombs (single player only; co-op uses the shared pool).
player.startLives = 3
player.startBombs = 5
# Player spawn-transition and death-wipe lengths (frames).
player.spawnTime = 40
player.destroyTime = 40
# Spawn-shield duration and how many frames remain when it starts warning.
player.shieldTime = 250
player.shieldWarnTime = 60
# Ship handling: top speed, turn response, and stick zones.
player.moveSpeed = 0.7
player.moveTurnRate = 0.2
player.stickDeadZone = 0.1
player.stickFullZone = 0.6
# Frames of cooldown between bombs.
player.bombCooldown = 50
# Score thresholds for the scoring economy.
player.weaponChangeScore = 10000
player.extraLifeScore = 75000
player.extraBombScore = 50000
# Multiplier: kills per step per life, and the effective ceiling (x1 + steps).
player.multiplierKillCount = 9
player.multiplierMax = 15
# When a weapon change rerolls, % chance it lands on weapon 1 (else weapon 2).
player.weapon1Chance = 50

# --- Weapon patterns -------------------------------------------------------
# Weapon 0 (twin shot): fire interval, missile speed, spread half-angle, and
# the fraction of the ship's velocity inherited by missiles.
weapon0.interval = 6
weapon0.missileSpeed = 0.7
weapon0.spread = 0.4
weapon0.inheritSpeed = 0.5
# Weapon 1 (heavy alternating double-tap): intervalA then intervalB cadence.
weapon1.intervalA = 4
weapon1.intervalB = 1
weapon1.missileSpeed = 1.2
weapon1.spread = 0.8
weapon1.inheritSpeed = 0.5
# Weapon 2 (5-way spread): inner/outer off-axis starts and spreads.
weapon2.interval = 7
weapon2.missileSpeed = 0.9
weapon2.startInner = 0.1
weapon2.startOuter = 0.15
weapon2.spreadInner = 0.05
weapon2.spreadOuter = 0.09
weapon2.inheritSpeed = 0.5

# --- Bomb -------------------------------------------------------------------
bomb.maxRings = 20
bomb.ringRadius = 1
bomb.ringThickness = 6
bomb.ringSpeed = 2
bomb.ringTimeToLive = 200
bomb.ringMaxRadius = 100
bomb.ringKillBand = 10
bomb.ringThicknessStep = 0.03

# --- Spawner: difficulty clock & cadence -----------------------------------
# Difficulty climbs to spawner.maxIndex at spawner.indexRate per frame; the
# current index scales wave sizes and unlocks enemy types.
spawner.maxIndex = 40
spawner.indexRate = 0.0008
# Spawner pause while a single player is down, and respawn attempt cadence.
spawner.respawnWaitTimer = 50
spawner.respawnDelay = 50
# Scatter (ambient) spawn cadence early on; every frame once past the index.
spawner.scatterInterval = 100
spawner.scatterEveryFrameIndex = 10
# New wave every waveCadence frames; waveChoices = how many weighted picks.
spawner.waveCadence = 20
spawner.waveChoices = 13
# Concurrent-wave caps unlock at these difficulty indexes.
spawner.waveCap1Index = 1
spawner.waveCap2Index = 12
spawner.waveUnlimitedIndex = 20
# Scatter black holes: % chance per check once index passes blackholeIndex.
spawner.blackholeChance = 4
spawner.blackholeIndex = 2

# --- Spawner: scatter target populations (index-gated) ----------------------
spawner.wandererEarly = 2
spawner.wandererMid = 4
spawner.gruntEarly = 2
spawner.gruntLate = 4
spawner.spinnerScatter = 2
spawner.weaverScatter = 2

# --- Spawner: wave sizing ----------------------------------------------------
# Population scalars scale wave sizes with difficulty progress. Keep at or
# below the matching hard pool ceilings (numEnemy* constants in enemies.hpp).
wave.popGrunt = 200
wave.popWeaver = 200
wave.popSnake = 50
wave.popSpinner = 100
wave.popBlackhole = 8
wave.popMayfly = 400
wave.popRepulsor = 4
# Minimum size for a generated wave of each type.
wave.minGrunt = 20
wave.minWeaver = 20
wave.minSnake = 8
wave.minSpinner = 20
wave.minBlackhole = 4
wave.minMayfly = 50
# Difficulty indexes past which the rarer wave types unlock.
wave.snakeIndex = 4
wave.blackholeIndex = 4
wave.mayflyIndex = 8
wave.repulsorIndex = 4
# Rush waves spawn this fraction of a swarm wave.
wave.rushDivide = 2

# --- Spawner: placement -------------------------------------------------------
spawner.scatterMargin = 15
spawner.waveMargin = 2
spawner.rushJitter = 4
spawner.rushRadiusPlayer = 40
spawner.rushRadiusBlackhole = 80
spawner.swarmJitter = 10
spawner.swarmWaveCadence = 10

# --- Base entity pacing & global difficulty creep -----------------------------
# Every entity's speed cap is multiplied by a global "aggression" that creeps
# up by entity.aggressionStep each frame.
entity.aggressionStep = 0.0002
entity.spawnTime = 40
entity.destroyTime = 3
entity.indicateTime = 75

# --- Per-enemy kill scores -----------------------------------------------------
score.grunt = 50
score.wanderer = 25
score.weaver = 100
score.spinner = 100
score.tinySpinner = 50
score.snake = 50
score.snakeSegment = 0
score.mayfly = 50
score.repulsor = 100
score.blackhole = 50
score.blackholeReward = 150
score.proton = 50
